server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/interview_coach}
    username: ${DB_USER:coach}
    password: ${DB_PASSWORD:coach_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
app:
  upload-dir: ${UPLOAD_DIR:./private-uploads}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  ai-model: ${OLLAMA_MODEL:qwen2.5:3b}
  ai-key: ${OLLAMA_API_KEY:ollama}
  ai-url: ${OLLAMA_API_URL:http://localhost:11434/v1/chat/completions}
  session-hours: 12
management:
  endpoints:
    web:
      exposure:
        include: health,info
